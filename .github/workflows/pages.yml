# Documentation site: build the Markdown docs into a static site and publish it
# to GitHub Pages. The build uses only Bun's built-in Markdown renderer
# (scripts/build-docs.ts), so no dependency is installed, no Ruby/Jekyll build
# runs and the artifact is exactly what is committed. Publishing runs only from
# master; the CI workflow remains the gate for code changes.
name: docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "scripts/build-docs.ts"
      - "scripts/docs/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two doc deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - run: bun run docs:build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
