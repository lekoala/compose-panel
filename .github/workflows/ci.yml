# Linux CI: unit tests, typecheck, pinned image build, smoke test and
# vulnerability scan. This workflow NEVER publishes images and NEVER mounts a
# Docker socket into a test: the smoke test runs the panel WITHOUT a socket
# (mutations fail honestly) and the Docker-dependent integration test stays
# opt-in (COMPOSE_PANEL_TEST_DOCKER=1, set only on disposable daemons).
name: ci

on:
  # Branches only: a filter on branches alone excludes tag pushes, which
  # release.yml already covers through workflow_call. A `tags-ignore` filter
  # alone would instead disable branch pushes too.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  # Weekly run on the default branch: new fixable CVEs and expired
  # .trivyignore.yaml entries fail the scan even when nothing is pushed.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run test
      - name: Host installer shell checks (no deployment)
        run: |
          shellcheck -e SC1090,SC1091 scripts/install.sh scripts/setup-caddy.sh scripts/doctor.sh deploy/caddy/with-caddy-lock.sh
          for script in scripts/install.sh scripts/setup-caddy.sh scripts/doctor.sh deploy/caddy/with-caddy-lock.sh; do bash -n "$script"; done
      # Same Compose plugin version as the image (DOCKER_COMPOSE_VERSION in the
      # Dockerfile), not whatever the runner ships. Bump both together. The
      # checksum is pinned here, not fetched from the same release.
      - name: Install pinned Compose plugin
        env:
          COMPOSE_VERSION: v5.6.1
          COMPOSE_SHA256: 47737f4236e6d3ccea7291995203f8f018058783b4c3a9469119811a0b5db8c0
        run: |
          set -e
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - name: Compose config integration (no daemon access)
        run: COMPOSE_PANEL_TEST_DOCKER=0 COMPOSE_PANEL_TEST_COMPOSE_CONFIG=1 bun test tests/compose-config-linux.test.ts
      - name: Production-only boot (no devDependencies)
        run: |
          set -e
          rm -rf /tmp/prod-only && mkdir -p /tmp/prod-only/stacks/demo
          cp package.json bun.lock /tmp/prod-only/
          cp -r src public /tmp/prod-only/
          printf 'services:\n  app:\n    image: hello-world\n' > /tmp/prod-only/stacks/demo/compose.yaml
          cd /tmp/prod-only
          bun install --production --frozen-lockfile
          test ! -e node_modules/@types
          HASH=$(COMPOSE_PANEL_PASSWORD=ci-prod-only bun src/scripts/hash-password.ts | tail -1)
          STACKS_DIR=/tmp/prod-only/stacks COMPOSE_PANEL_ADMIN_USER=cioperator COMPOSE_PANEL_ADMIN_PASSWORD_HASH="$HASH" bun src/server.ts &
          PANEL_PID=$!
          trap "kill $PANEL_PID 2>/dev/null || true" EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5081/health/live; then ready=1; break; fi
            # A refused configuration exits at once: fail now, not after 30 s.
            if ! kill -0 "$PANEL_PID" 2>/dev/null; then echo "The panel exited during startup." >&2; exit 1; fi
            sleep 1
          done
          test "$ready" = "1"
      - name: Scan repository (dependencies and secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
          skip-dirs: node_modules,private,.git

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t compose-panel:ci --build-arg VERSION="$(node -p "require('./package.json').version")" --build-arg REVISION="${GITHUB_SHA}" .
      - name: "Smoke test (no Docker socket: reads and auth only)"
        run: |
          set -e
          mkdir -p /tmp/ci-stacks/demo
          printf 'services:\n  app:\n    image: hello-world\n' > /tmp/ci-stacks/demo/compose.yaml
          HASH=$(docker run --rm --entrypoint bun -e COMPOSE_PANEL_PASSWORD=ci-smoke-password compose-panel:ci src/scripts/hash-password.ts | tail -1)
          docker run -d --name ci-panel -e STACKS_DIR=/stacks -e COMPOSE_PANEL_ADMIN_USER=cioperator -e COMPOSE_PANEL_ADMIN_PASSWORD_HASH="$HASH" -v /tmp/ci-stacks:/stacks compose-panel:ci
          sleep 5
          docker exec ci-panel curl -fsS http://127.0.0.1:5081/health/live
          docker exec ci-panel sh -c 'O=http://127.0.0.1:5081; curl -fsS -c /tmp/j -o /tmp/l.html $O/login && grep -q "name=\"csrf\"" /tmp/l.html && C=$(grep -o "name=\"csrf\" value=\"[^\"]*\"" /tmp/l.html | head -1 | cut -d"\"" -f4) && [ "$(curl -sS -o /dev/null -w "%{http_code}" -b /tmp/j -c /tmp/j -H "Origin: $O" --data-urlencode "csrf=$C" --data-urlencode "user=cioperator" --data-urlencode "password=ci-smoke-password" $O/login)" = "303" ] && curl -fsS -b /tmp/j $O/ | grep -q demo'
          docker exec ci-panel sh -c 'docker compose version && bun --version'
          docker rm -f ci-panel
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: compose-panel:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          # Fixable findings still fail; see .trivyignore.yaml for the policy.
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
