# Linux CI: unit tests, typecheck, reproducible image build, smoke test and
# vulnerability scan. This workflow NEVER publishes images and NEVER mounts a
# Docker socket into a test: the smoke test runs the panel WITHOUT a socket
# (mutations fail honestly) and the Docker-dependent integration test stays
# opt-in (COMPOSE_PANEL_TEST_DOCKER=1, set only on disposable daemons).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Compose config integration (no daemon access)
        run: COMPOSE_PANEL_TEST_DOCKER=0 COMPOSE_PANEL_TEST_COMPOSE_CONFIG=1 bun test tests/compose-config-linux.test.ts

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t compose-panel:ci .
      - name: "Smoke test (no Docker socket: reads and auth only)"
        run: |
          set -e
          mkdir -p /tmp/ci-stacks/demo
          printf 'services:\n  app:\n    image: hello-world\n' > /tmp/ci-stacks/demo/compose.yaml
          HASH=$(docker run --rm --entrypoint bun -e COMPOSE_PANEL_PASSWORD=ci-smoke-password compose-panel:ci src/scripts/hash-password.ts | tail -1)
          docker run -d --name ci-panel -e STACKS_DIR=/stacks -e COMPOSE_PANEL_ADMIN_PASSWORD_HASH="$HASH" -v /tmp/ci-stacks:/stacks compose-panel:ci
          sleep 5
          docker exec ci-panel curl -fsS http://127.0.0.1:5081/health/live
          docker exec ci-panel sh -c 'O=http://127.0.0.1:5081; curl -fsS -c /tmp/j -o /tmp/l.html $O/login && grep -q "name=\"csrf\"" /tmp/l.html && C=$(grep -o "name=\"csrf\" value=\"[^\"]*\"" /tmp/l.html | head -1 | cut -d"\"" -f4) && [ "$(curl -sS -o /dev/null -w "%{http_code}" -b /tmp/j -c /tmp/j -H "Origin: $O" --data-urlencode "csrf=$C" --data-urlencode "user=admin" --data-urlencode "password=ci-smoke-password" $O/login)" = "303" ] && curl -fsS -b /tmp/j $O/ | grep -q demo'
          docker exec ci-panel sh -c 'docker compose version && bun --version'
          docker rm -f ci-panel
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: compose-panel:ci
          format: table
          severity: CRITICAL
          exit-code: '1'
