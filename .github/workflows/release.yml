# Release: publish the panel image to GHCR. Triggered ONLY by a maintainer
# tag (bare semver, e.g. 0.1.0, no "v" prefix). Nothing here runs on branches
# or pull requests, so a release can never happen by accident: creating the
# tag IS the release decision.
# Dry-run the same build locally first with `bun run docker:build`.
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# Serialize registry writes, including retries of different tags.
concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lekoala/compose-panel

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refuse a tag that does not match package.json
        run: |
          test "$GITHUB_REF_NAME" = "$(node -p "require('./package.json').version")"
      # QEMU emulates arm64 on the amd64 runner (e.g. Oracle Ampere hosts).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Each platform is built and loaded locally, then scanned, before anything
      # is pushed. The final multi-platform push reuses the builder cache.
      - name: Build linux/amd64 image (local only, not pushed yet)
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg REVISION="${GITHUB_SHA}" \
            -t "$IMAGE:scan-amd64" .
      - name: Scan linux/amd64 image (gate before any push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/lekoala/compose-panel:scan-amd64
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Fixable findings still fail; see .trivyignore.yaml for the policy.
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - name: Build linux/arm64 image (local only, not pushed yet)
        run: |
          docker buildx build --platform linux/arm64 --load \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg REVISION="${GITHUB_SHA}" \
            -t "$IMAGE:scan-arm64" .
      - name: Scan linux/arm64 image (gate before any push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/lekoala/compose-panel:scan-arm64
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push multi-platform version tag and latest
        id: image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg REVISION="${GITHUB_SHA}" \
            -t "$IMAGE:$GITHUB_REF_NAME" \
            -t "$IMAGE:latest" .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image-metadata.json")"
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # ADR 0018: the release records the pushed image index digest; the panel
      # installs a pulled image only if its RepoDigests carries this digest and
      # the release is 72 hours old. Created last, so published_at is the
      # moment everything above succeeded.
  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Fetch master, not the tagged copy. The Contents API file SHA refuses a
      # concurrent external edit. A repeated digest leaves its original date.
      - name: Record the digest in the versioned release registry
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/releases.json?ref=master" > "$RUNNER_TEMP/registry-response.json"
          jq -er '.content' "$RUNNER_TEMP/registry-response.json" | base64 -d > "$RUNNER_TEMP/registry.json"
          cp "$RUNNER_TEMP/registry.json" "$RUNNER_TEMP/registry-before.json"
          bun scripts/record-release.ts "$RUNNER_TEMP/registry.json" "$GITHUB_REF_NAME" "$DIGEST" "$GITHUB_SHA"
          if ! cmp -s "$RUNNER_TEMP/registry-before.json" "$RUNNER_TEMP/registry.json"; then
            sha="$(jq -er '.sha' "$RUNNER_TEMP/registry-response.json")"
            content="$(base64 -w0 "$RUNNER_TEMP/registry.json")"
            jq -n --arg message "Record release $GITHUB_REF_NAME digest" --arg content "$content" --arg sha "$sha" \
              '{message: $message, content: $content, sha: $sha, branch: "master"}' > "$RUNNER_TEMP/registry-update.json"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/releases.json" --input "$RUNNER_TEMP/registry-update.json" > /dev/null
          fi
      # A failed publication is retryable. A replacement digest has already
      # been appended to the registry and must wait another 72 hours (ADR 0028).
      - name: Create or update the GitHub Release with the image digest
        run: |
          set -euo pipefail
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          line="compose-panel-image-digest: $DIGEST"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/notes-before.md"
            grep -v '^compose-panel-image-digest:' "$RUNNER_TEMP/notes-before.md" > "$RUNNER_TEMP/notes.md" || test "$?" -eq 1
            printf '\n%s\n' "$line" >> "$RUNNER_TEMP/notes.md"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            printf 'Image: `%s:%s`\n\n%s\n\nCommit: %s\n' \
              "$IMAGE" "$GITHUB_REF_NAME" "$line" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
