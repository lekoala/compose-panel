# Release: publish the panel image to GHCR. Triggered ONLY by a maintainer
# tag (v*). Nothing here runs on branches or pull requests, so a release can
# never happen by accident: creating the tag IS the release decision.
# Dry-run the same build locally first with `bun run docker:build`.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse a tag that does not match package.json
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image (local only, not pushed yet)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64 --load \
            -t ghcr.io/lekoala/compose-panel:"$VER" \
            -t ghcr.io/lekoala/compose-panel:latest .
      - name: Scan image (gate before any push)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/lekoala/compose-panel:latest
          format: table
          severity: CRITICAL
          exit-code: "1"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push version tag and latest
        run: |
          VER="${GITHUB_REF_NAME#v}"
          docker push ghcr.io/lekoala/compose-panel:"$VER"
          docker push ghcr.io/lekoala/compose-panel:latest
