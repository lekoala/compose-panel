# Compose Panel deployment. Single instance, single host.
#
# The panel binds 127.0.0.1 ONLY (hard-coded in src/server.ts), so with host
# networking it is reachable on the host loopback and nowhere else. Reach it
# remotely with an SSH tunnel, never by publishing a port:
#   ssh -L5081:127.0.0.1:5081 you@host
#
# Host path == container path is REQUIRED for stacks and the Docker socket:
# the panel matches `docker compose ls` ConfigFiles against its own paths.
name: compose-panel

services:
  panel:
    build:
      context: ..
      dockerfile: Dockerfile
    # Local dev default. For a release, use a published image instead:
    # image: ghcr.io/lekoala/compose-panel:latest  (About > Update follows it)
    # image: ghcr.io/lekoala/compose-panel:0.3.0   (pinned: update from the host)
    image: compose-panel:local
    container_name: compose-panel
    # Share the host network namespace so the loopback bind IS the host
    # loopback. Do not add ports: there is nothing to publish.
    network_mode: host
    # Must exceed COMPOSE_PANEL_SHUTDOWN_GRACE_MS (default 30s) so running
    # operations drain before the container is killed.
    stop_grace_period: 35s
    restart: unless-stopped
    volumes:
      # Full control over the host Docker daemon. Trusted admin only.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path on both sides, or project matching breaks. Adjust both the
      # mount AND STACKS_DIR together if your stacks live elsewhere.
      - /opt/stacks:/opt/stacks
      # Caddy helper socket directory (ADR 0030), always mounted so enabling
      # the integration never requires editing this file. Unused (an empty
      # directory on /run) until scripts/setup-caddy.sh installs the helper
      # and sets COMPOSE_PANEL_CADDY_* in compose-panel.env. The DIRECTORY, not
      # the socket file: restarting caddy-helper.socket recreates the socket,
      # and a file bind mount would keep pointing at the removed one. Same path
      # on both sides; read-only is enough to connect.
      - /run/compose-panel:/run/compose-panel:ro
    env_file:
      - compose-panel.env
    environment:
      STACKS_DIR: /opt/stacks
      PORT: 5081
