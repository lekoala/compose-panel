<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Compose Panel — actif"><style>
.halo{transform-box:fill-box;transform-origin:center;opacity:0}
.run{transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{transform:scale(1);opacity:.7}70%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}
@keyframes beat{0%{transform:scale(1)}12%{transform:scale(1.14)}35%{transform:scale(1)}100%{transform:scale(1)}}
.halo{animation:halo 2.4s cubic-bezier(0,0,.2,1) infinite}.run{animation:beat 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.halo,.run{animation:none}}</style><g transform="translate(8,8)">
<rect x="2" y="2" width="60" height="60" fill="none" stroke="#F4F4F2" stroke-width="4"/>
<rect class="halo" x="26" y="10" width="12" height="12" fill="none" stroke="#6C8CFF" stroke-width="2"/>
<rect class="run " style="" x="26" y="10" width="12" height="12" fill="#6C8CFF"/>
<rect class=" " style="" x="10" y="26" width="12" height="12" fill="#F4F4F2"/>
<rect class=" " style="" x="26" y="26" width="12" height="12" fill="#F4F4F2"/>
<rect class=" " style="" x="42" y="26" width="12" height="12" fill="#F4F4F2"/>
<rect class=" " style="" x="10" y="42" width="12" height="12" fill="#F4F4F2"/>
<rect class=" " style="" x="26" y="42" width="12" height="12" fill="#F4F4F2"/>
<rect class="" style="" x="43" y="43" width="10" height="10" fill="none" stroke="#F4F4F2" stroke-width="2"/>
</g></svg>
