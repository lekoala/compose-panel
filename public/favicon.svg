<rect x="26" y="10" width="12" height="12" fill="#6C8CFF"/>
<rect x="10" y="26" width="12" height="12" fill="#F4F4F2"/><rect x="26" y="26" width="12" height="12" fill="#F4F4F2"/><rect x="42" y="26" width="12" height="12" fill="#F4F4F2"/>
<rect x="10" y="42" width="12" height="12" fill="#F4F4F2"/><rect x="26" y="42" width="12" height="12" fill="#F4F4F2"/>
<rect x="43" y="43" width="10" height="10" fill="none" stroke="#F4F4F2" stroke-width="2"/></svg>
