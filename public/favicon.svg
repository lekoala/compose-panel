<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><!-- Tab icon on a plate. Dark by default; light only when the scheme says light. The plate always contrasts with its own blocks, so the icon stays legible even when the tab bar does not match the OS scheme (Chrome incognito is always dark). The page header uses brand-mark.svg. --><style>
.p{fill:#111111} .k{fill:#F4F4F2} .a{fill:#6C8CFF} .o{fill:none;stroke:#F4F4F2;stroke-width:2}
@media (prefers-color-scheme: light){ .p{fill:#FFFFFF} .k{fill:#111111} .a{fill:#2F5BFF} .o{stroke:#111111} }
</style>
<rect class="p" width="64" height="64" rx="12"/>
<rect class="a" x="26" y="10" width="12" height="12"/>
<rect class="k" x="10" y="26" width="12" height="12"/><rect class="k" x="26" y="26" width="12" height="12"/><rect class="k" x="42" y="26" width="12" height="12"/>
<rect class="k" x="10" y="42" width="12" height="12"/><rect class="k" x="26" y="42" width="12" height="12"/>
<rect class="o" x="43" y="43" width="10" height="10"/></svg>
