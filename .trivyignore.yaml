# Trivy exceptions for the image scans (ci.yml "image", release.yml).
# Policy: unfixed CVEs are skipped by `ignore-unfixed`; any fixable HIGH or
# CRITICAL fails the build unless it is listed here with a reason, the exact
# path it applies to, and an expiry date. Past `expired_at` the entry stops
# applying and the scan fails again, so every exception is re-decided.
#
# No exception is currently needed: Docker Compose v5.7.0 is built with Go
# 1.26.10 and golang.org/x/net v0.60.0, which fixes CVE-2026-78669.
vulnerabilities: []
