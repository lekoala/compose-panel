# Trivy exceptions for the image scans (ci.yml "image", release.yml).
# Policy: unfixed CVEs are skipped by `ignore-unfixed`; any fixable HIGH or
# CRITICAL fails the build unless it is listed here with a reason, the exact
# path it applies to, and an expiry date. Past `expired_at` the entry stops
# applying and the scan fails again, so every exception is re-decided.
#
# Docker Compose v5.6.0 (the latest release, and the latest
# docker-compose-plugin in Docker's Debian 13 repository) is built with Go
# 1.26.8 and golang.org/x/net v0.58.0. The fixes exist upstream but are not in
# any Compose release yet. Remove these entries when DOCKER_COMPOSE_VERSION in
# the Dockerfile moves to a release built with Go >= 1.26.9 and x/net >= 0.60.0.
vulnerabilities:
  - id: CVE-2026-78669
    paths:
      - "usr/libexec/docker/cli-plugins/docker-compose"
    statement: >-
      HTTP/2 SETTINGS-frame CPU exhaustion (x/net and stdlib). Compose is only an
      HTTP/2 client here: a malicious registry contacted during a pull could
      consume CPU. Bounded by the operation timeout and the one-operation-per-stack
      lock; no Compose release with the fix exists yet.
    expired_at: 2026-11-10
  - id: CVE-2026-78667
    paths:
      - "usr/libexec/docker/cli-plugins/docker-compose"
    statement: >-
      Range-header CPU exhaustion in net/http FileServer/ServeContent. Server-side
      only; Compose serves no HTTP in this image. No Compose release with the fix
      exists yet.
    expired_at: 2026-11-10
  - id: CVE-2026-97031
    paths:
      - "usr/libexec/docker/cli-plugins/docker-compose"
    statement: >-
      crypto/tls ECH memory exhaustion. Server-side only; Compose terminates no TLS
      in this image. No Compose release with the fix exists yet.
    expired_at: 2026-11-10
