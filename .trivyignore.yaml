# Trivy exceptions for the image scans (ci.yml "image", release.yml).
# Policy: unfixed CVEs are skipped by `ignore-unfixed`; any fixable HIGH or
# CRITICAL fails the build unless it is listed here with a reason, the exact
# path it applies to, and an expiry date. Past `expired_at` the entry stops
# applying and the scan fails again, so every exception is re-decided.
#
# Compose v5.8.0 still declares golang.org/x/net v0.60.0, so the module-level
# finding for CVE-2026-78661 remains; the vulnerable package
# golang.org/x/net/html is not linked into the binary. See ADR 0039.
vulnerabilities:
  - id: CVE-2026-78661
    paths:
      - usr/libexec/docker/cli-plugins/docker-compose
    expired_at: 2027-02-19
    statement: >-
      Trivy reports the Go module version, not the linked packages. In Compose
      5.8.0 (Debian 5.8.0-1~debian.13~trixie) the advisory package
      golang.org/x/net/html has no symbol-table matches while
      golang.org/x/net/http2 and /idna do, so the vulnerable HTML parser is not
      compiled in. This is not a VEX claim of non-exploitability: the module
      stays vulnerable on paper. Re-run the symbol check and record a new
      decision before expiry; remove as soon as a Compose binary embeds x/net
      v0.62.0+.
