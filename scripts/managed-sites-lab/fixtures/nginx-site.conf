# Disposable gateway for the managed-site lab (ADR 0042/0043).
#
# __SITE_ROOT__ is replaced by the run script with the real absolute stack path,
# and the file is written into the site's generated/ directory. Host path and
# container path are identical, like the real deployment.
#
# The document root is resolved through `runtime/current` on every request,
# because `runtime/` (the parent) is bind-mounted, never `current` itself.
# The fixed revision probe lives outside `public/` and is reachable only through
# this one exact location. The dotfile rule is evaluated before the PHP rule, so
# the probe script itself is never reachable by its `.php` name.
server {
	listen 80;
	server_name _;

	root __SITE_ROOT__/site/runtime/current/public;
	index index.php;

	location = /.compose-panel/revision {
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME __SITE_ROOT__/site/runtime/current/.compose-panel/revision.php;
		fastcgi_pass php:9000;
	}

	location ~ /\.(?!well-known) {
		deny all;
	}

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location ~ \.php$ {
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME __SITE_ROOT__/site/runtime/current/public$fastcgi_script_name;
		fastcgi_pass php:9000;
	}
}
