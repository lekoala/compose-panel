; The lab needs a long-lived PHP process that keeps compiled code, so that the
; prove-the-recreate step is deterministic: no timestamp revalidation.
; The official PHP image already loads OPcache as a Zend extension; loading it
; again is an error, so this file only sets the policy.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.file_update_protection=0
